schema_version: '1.2'
id: frontier-systems-review
name: Frontier Systems Review
short_name: Frontier Systems
strapline: AI 基建、CCUS 与能源转型的持续认知刊物
language: zh-CN

owner:
  type: github
  repository: liuh886/NewsFlow
  editor: liuh886

reader_promise: >-
  沿能源、芯片、基础设施、模型和应用五层，判断 AI 投入能否形成可靠、经济的智能产出；
  同时判断工业低碳转型是否获得足够的资本、设备、运输封存网络和制度条件。

editorial_view: >-
  AI 不是单一模型或单一数据中心，而是能源、芯片、基础设施、模型和应用相互牵引的产业系统。
  任一层的供给、效率或需求停滞都会限制整体价值；CCUS 的落地同样取决于跨环节交付、责任安排和可核验运行数据。

channels:
  - id: ai-infrastructure
    name: AI 基建
    promise: 沿五层 AI 产业栈判断上游投入能否转化为可持续的智能产出和应用价值。
  - id: ccus-energy-transition
    name: CCUS 与能源转型
    promise: 判断碳管理项目是否正从政策承诺和项目公告走向可融资、可建设、可运行的系统。

scope:
  include:
    - AI energy supply, grid connection, power equipment and energy economics
    - AI chips, memory, networking silicon, advanced packaging and semiconductor capacity
    - AI factories, data centers, servers, networking, storage, cooling and cloud capacity
    - model capability, efficiency and openness when they change compute demand or deployment economics
    - production AI applications with measurable adoption, workload, revenue or productivity evidence
    - carbon capture, transport, storage and utilisation infrastructure
    - industrial decarbonisation project economics
    - carbon pricing, subsidies, MRV and long-term liability
  exclude:
    - consumer AI product launches without infrastructure consequences
    - model benchmarks without deployment or resource implications
    - generic climate pledges without implementation evidence
    - CCUS memoranda without capital, capacity, permit or schedule movement
    - unattributed aggregation
    - announcements that repeat existing evidence

source_policy:
  primary:
    - regulators, governments, system operators and standards bodies
    - company filings, earnings materials and project disclosures for facts about the reporting company
    - peer-reviewed or institutional research and official datasets
  mainstream:
    - named reporting with direct links to original evidence
    - independent reporting used to corroborate disputed or high-impact claims
  specialist:
    - named domain experts with traceable evidence and clear authorship
  corporate_limitations:
    - company disclosures prove attributed company facts, not independent industry conclusions
    - forecasts, targets and intended capacity must not be described as delivered results
    - material company claims require original filings or independent corroboration
  reject:
    - content farms, anonymous aggregation and AI-generated roundups
    - search snippets or headlines without full-text access
    - duplicated announcements and unsupported causal claims

materiality:
  minimum_quality: 8.0
  evidence_confidence_minimum: 4.0
  editorial_value_minimum: 4.0
  max_signals_per_issue: 6
  max_signals_per_channel: 4
  minimum_signals_per_channel: 0
  rules:
    - publication recency alone is not novelty
    - prefer new primary evidence over repeated commentary
    - prefer project-stage movement over announcement volume
    - evidence may strengthen, weaken or complicate the editorial view
    - state explicitly when evidence does not change the editorial view
    - classify every AI Signal by the five-layer model and allow cross-layer links when evidence connects supply to demand
    - do not treat energy, announced chip capacity, model benchmarks or application demos as delivered end-to-end value
    - never fill a channel or issue to a fixed length

publishing:
  desk:
    enabled: true
    cadence: continuous
  edition:
    enabled: true
    cadence: twice_monthly
    days: [1, 15]
    timezone: Asia/Shanghai
    automatic: true
    manual_review_required: false
    fixed_length: false

storylines:
  - id: ai-energy-foundation
    channel_id: ai-infrastructure
    title: 第一层：能源
    question: 能源供给、并网速度、功率质量和成本能否支撑 AI 产能扩张？
    baseline_view: 能源是 AI 产业栈的基础层和约束条件之一，但不能代替对芯片、系统、模型与应用的判断。
    watch_for: [大型负荷并网, 发电与储能, 长期购电协议, 电力设备, 单位智能产出的能源成本]
    falsifiers: [并网周期持续缩短, 能效提升抵消新增负荷, 能源成本不再影响选址和利用率]
    keywords: [energy, electricity, power, grid, generation, storage, 能源, 电力, 并网]

  - id: ai-chip-layer
    channel_id: ai-infrastructure
    title: 第二层：芯片
    question: 加速器、CPU、内存、网络芯片、先进制程和封装能否按成本与节奏交付？
    baseline_view: AI 芯片供给是由设计、晶圆制造、先进封装、HBM 与网络硅共同形成的系统产能，而不是单一 GPU 数量。
    watch_for: [新架构量产, 晶圆与封装扩产, HBM 供给, 定制芯片, 出口管制, 单位算力成本]
    falsifiers: [关键芯片普遍供过于求, 先进封装不再构成约束, 性能提升无法改善系统级经济性]
    keywords: [GPU, accelerator, semiconductor, HBM, foundry, packaging, ASIC, 芯片, 晶圆, 封装]

  - id: ai-infrastructure-layer
    channel_id: ai-infrastructure
    title: 第三层：基础设施
    question: 芯片能否被整合为按期投运、高利用率、可靠且经济的 AI 工厂与云服务？
    baseline_view: 服务器、网络、存储、冷却、设施、软件编排与融资共同决定已采购芯片能否形成可用算力。
    watch_for: [AI 工厂投产, 机架与网络交付, 液冷, 云容量, 利用率, 故障, 每 Token 系统成本]
    falsifiers: [新增容量长期低利用率, 系统瓶颈抵消芯片性能, 高密度部署持续推高故障与成本]
    keywords: [AI factory, data center, rack, network, storage, cooling, cloud capacity, utilization, 基础设施, 数据中心]

  - id: ai-model-layer
    channel_id: ai-infrastructure
    title: 第四层：模型
    question: 模型能力与效率变化是否实质改变训练、推理和部署的资源需求与经济性？
    baseline_view: 模型层值得关注的不是排行榜本身，而是能力、架构、开放性和推理方法如何改变下层需求与可部署性。
    watch_for: [训练算力, 推理成本, 稀疏与小模型, 开源权重, 上下文与推理扩展, 评测的资源口径]
    falsifiers: [能力提升不再增加资源需求, 小模型普遍替代大规模推理, 模型差异不影响部署成本]
    keywords: [foundation model, reasoning model, inference cost, training compute, open weights, 模型, 推理, 训练]

  - id: ai-application-layer
    channel_id: ai-infrastructure
    title: 第五层：应用
    question: 企业软件、智能体、机器人和行业 AI 是否形成可量化、可持续的生产需求与价值？
    baseline_view: 应用层是五层投入能否转化为价值的最终检验，也决定模型、基础设施、芯片与能源的真实需求。
    watch_for: [生产部署, 付费使用, 智能体工作流, 机器人规模, 收入, 生产率, 失败与回滚]
    falsifiers: [试点无法转向生产, 使用量增长不产生价值, 应用收入不足以覆盖推理与集成成本]
    keywords: [AI application, agent, copilot, robotics, production deployment, productivity, 应用, 智能体, 机器人]

  - id: ccus-project-delivery
    channel_id: ccus-energy-transition
    title: CCUS 项目交付
    question: 项目是否从公告进入 FID、融资关闭、建设、调试和稳定运行？
    baseline_view: 项目阶段与实际运行数据比宣布容量更能说明产业是否规模化。
    watch_for: [FID, financial close, permit, construction, commissioning, operational data]
    falsifiers: [项目按期低成本投运, 实际捕集率稳定达标, 取消与延期显著减少]
    keywords: [CCUS, CCS, FID, capture, commissioning, 投资决定, 投产]

  - id: ccus-network-economics
    channel_id: ccus-energy-transition
    title: CO2 网络与商业结构
    question: 共享运输和封存网络能否形成可融资、可扩展的商业结构？
    baseline_view: 锚定客户、容量合同和跨主体责任是共享网络形成规模经济的前提。
    watch_for: [运输封存合同, 注入容量, 管道与船运, 收费机制, 锚定客户]
    falsifiers: [开放网络持续满负荷运行, 单位运输封存成本下降, 无补贴扩建获得融资]
    keywords: [CO2 transport, storage, pipeline, shipping, injection, 运输, 封存, 注入]

  - id: evidence-governance
    channel_id: ccus-energy-transition
    title: CCUS 制度、证据与责任
    question: 补贴、碳价、MRV、许可和长期责任能否支持规模化？
    baseline_view: 可核验数据和明确责任接口正在成为项目融资与跨境协作的前置条件。
    watch_for: [碳价与补贴, MRV, 储存许可, 跨境规则, 长期责任移交]
    falsifiers: [项目在低政策支持下可融资, 许可周期持续缩短, 责任框架不再构成障碍]
    keywords: [CBAM, carbon price, MRV, regulation, liability, 碳价, 监管, 责任]

writing:
  tone: analytical and direct
  distinguish_fact_and_interpretation: true
  attribute_company_claims: true
  avoid: [hype, generic significance claims, artificial balance, target-as-result]
