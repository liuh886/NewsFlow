name: Reader check path update once

on:
  push:
    branches:
      - refactor/reader-ui-canonical
    paths:
      - .github/workflows/reader-check-once.yml

permissions:
  contents: write

jobs:
  update-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reader-ui-canonical
          fetch-depth: 0
      - name: Update retired Reader paths in the repository contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'src/editorial-app.js': 'src/reader/core.js',
              'src/edition-layer.js': 'src/reader/edition.js',
              'public/magazine-polish.js': 'src/reader/magazine.js',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit path-contract update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check.mjs
          git commit -m "test(reader): bind repository contract to canonical paths"
          git push origin HEAD:refactor/reader-ui-canonical
