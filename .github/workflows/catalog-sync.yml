name: Sync signal catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/data/news.json'
      - 'public/data/data-status.json'

permissions:
  contents: read

concurrency:
  group: newsflow-catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Supabase catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ vars.NEWSFLOW_SUPABASE_URL || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
    steps:
      - name: Skip when catalog credentials are absent
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "Supabase catalog sync skipped because credentials are not configured."

      - name: Checkout
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        uses: actions/checkout@v6

      - name: Set up Node
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm ci

      - name: Sync catalog
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run supabase:catalog
