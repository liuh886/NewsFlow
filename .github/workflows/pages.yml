name: NewsFlow Frontend

# Reader deployment consumes canonical public publication state only.
# Private Candidates remain in Supabase; publication-sync.yml projects chief-published state to GitHub/Pages.

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'content/runs/**'
      - 'content/state/adoption-sync.json'
      - 'content/state/governance-sync.json'
      - 'config/**'
      - 'scripts/**'
      - 'tests/browser-smoke.mjs'
      - 'supabase/newsflow-editorial.sql'
      - 'supabase/newsflow-publication-projection.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'skills/newsflow-recommender/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/publication-sync.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'content/runs/**'
      - 'content/state/adoption-sync.json'
      - 'content/state/governance-sync.json'
      - 'config/**'
      - 'scripts/**'
      - 'tests/browser-smoke.mjs'
      - 'supabase/newsflow-editorial.sql'
      - 'supabase/newsflow-publication-projection.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'skills/newsflow-recommender/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/publication-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsflow-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund

      - name: Validate product and data contracts
        run: npm run check

      - name: Build static site
        env:
          NEWSFLOW_SUPABASE_URL: ${{ vars.NEWSFLOW_SUPABASE_URL || '' }}
          NEWSFLOW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEWSFLOW_SUPABASE_PUBLISHABLE_KEY || '' }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: npm run build

      - name: Verify Cloudflare RUM when configured
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: |
          if [ -n "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" ]; then
            grep -q 'static.cloudflareinsights.com/beacon.min.js' dist/index.html
            grep -q "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" dist/index.html
          fi

      - name: Install browser-smoke runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.61.1

      - name: Start validated preview
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/newsflow-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/newsflow-preview.log
          exit 1

      - name: Browser acceptance smoke
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node tests/browser-smoke.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
