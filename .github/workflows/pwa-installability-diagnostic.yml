name: PWA Installability Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pwa-installability-diagnostic.yml'
      - 'index.html'
      - 'public/manifest.webmanifest'
      - 'public/icon.svg'
      - 'public/sw.js'
      - 'public/startup-resilience.js'
      - 'public/pwa-install.js'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  chromium-installability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.61.1
      - name: Start built Reader
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/newsflow-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/newsflow-preview.log
          exit 1
      - name: Ask Chromium for installability errors
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_BIN, args: ['--no-sandbox'] });
          try {
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.evaluate(async () => {
              if ('serviceWorker' in navigator) await navigator.serviceWorker.ready;
            });
            const session = await page.context().newCDPSession(page);
            const manifest = await session.send('Page.getAppManifest');
            const result = await session.send('Page.getInstallabilityErrors');
            console.log('Manifest URL:', manifest.url);
            console.log('Manifest parse errors:', JSON.stringify(manifest.errors));
            console.log('Installability errors:', JSON.stringify(result.installabilityErrors));
            if (manifest.errors?.length || result.installabilityErrors?.length) process.exitCode = 1;
          } finally {
            await browser.close();
          }
          NODE
