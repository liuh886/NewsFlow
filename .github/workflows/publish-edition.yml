name: Publish autonomous edition

on:
  schedule:
    - cron: '15 1 1,15 * *'
  workflow_dispatch:
    inputs:
      publication_date:
        description: 'Optional publication date in YYYY-MM-DD format'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: newsflow-publication-writer
  cancel-in-progress: false

jobs:
  publish:
    name: Compile and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEWSFLOW_SUPABASE_URL: ${{ vars.NEWSFLOW_SUPABASE_URL || '' }}
      NEWSFLOW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEWSFLOW_SUPABASE_PUBLISHABLE_KEY || '' }}
    steps:
      - name: Require publication configuration
        if: env.NEWSFLOW_SUPABASE_URL == '' || env.NEWSFLOW_SUPABASE_PUBLISHABLE_KEY == ''
        run: |
          echo "NEWSFLOW_SUPABASE_URL and NEWSFLOW_SUPABASE_PUBLISHABLE_KEY are required." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund

      - name: Compile semi-monthly edition
        shell: bash
        run: |
          if [ -n "${{ inputs.publication_date }}" ]; then
            node scripts/publish-edition.mjs --date="${{ inputs.publication_date }}" --force
          else
            npm run publish:edition
          fi
          npm run content:status

      - name: Validate publication
        run: |
          npm run check
          npm run build

      - name: Commit published issue
        shell: bash
        run: |
          if git diff --quiet -- public/data/issues.json public/data/news.json public/data/data-status.json; then
            echo "No publication changes were generated."
            exit 0
          fi
          git config user.name "newsflow-edition-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/issues.json public/data/news.json public/data/data-status.json
          git commit -m "publish: semi-monthly editor-selected edition"
          git pull --rebase origin main
          git push
