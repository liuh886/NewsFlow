name: Sync chief editorial state

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-editorial-governance.mjs'
      - 'scripts/sync-adopted-signals.mjs'
      - '.github/workflows/editorial-sync.yml'

permissions:
  contents: write

concurrency:
  group: newsflow-editorial-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Apply chief decisions and governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.NEWSFLOW_SUPABASE_URL || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
    steps:
      - name: Skip when Supabase credentials are absent
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "NewsFlow editorial sync skipped because server credentials are not configured."

      - name: Checkout main
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked toolchain
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm ci --no-audit --no-fund

      - name: Pull published editorial state
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        id: sync
        run: |
          npm run editorial:sync
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed publication state
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm run check
          npm run build

      - name: Commit chief editorial state
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "newsflow-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json public/data/data-status.json public/data/edition.json public/data/storylines.json public/data/governance-status.json config/content-sources.json content/state/governance-sync.json content/state/adoption-sync.json
          git commit -m "editorial: sync chief decisions"
          git push origin HEAD:main
