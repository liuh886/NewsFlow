name: Sync private candidates to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/data/news.json'
      - 'public/data/edition.json'
      - 'content/inbox/**'
      - 'content/state/pipeline-review-queue.json'
      - 'config/content-sources.json'
      - 'scripts/sync-supabase.mjs'
      - '.github/workflows/supabase-sync.yml'

permissions:
  contents: read

concurrency:
  group: newsflow-supabase-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync private editorial candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ vars.NEWSFLOW_SUPABASE_URL || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
    steps:
      - name: Require Supabase credentials
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: |
          echo "NEWSFLOW_SUPABASE_URL variable and SUPABASE_SERVICE_ROLE_KEY secret are required." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked toolchain
        run: npm ci --no-audit --no-fund

      - name: Sync private candidates
        run: npm run supabase:sync
