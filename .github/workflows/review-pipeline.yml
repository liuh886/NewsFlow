name: Process review pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'
  push:
    paths:
      - 'content/inbox/*.json'

permissions:
  contents: write

concurrency:
  group: newsflow-content-writer
  cancel-in-progress: false

jobs:
  process:
    name: Process reviews and apply accepted candidates
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.NEWSFLOW_SUPABASE_URL || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Process shared review outcomes
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Shared review processing skipped: credentials are not configured."
            exit 0
          fi
          node scripts/process-reviews.mjs --supabase --apply

      - name: Apply auto-accepted candidates
        shell: bash
        run: |
          shopt -s nullglob
          for pack in content/inbox/review-processed-*.json; do
            echo "Applying $pack..."
            node scripts/update-content.mjs --input="$pack" --apply
            rm "$pack"
          done
          shopt -u nullglob
          npm run content:status

      - name: Validate updated publication
        run: |
          npm run check
          npm run build

      - name: Commit applied signals and state
        shell: bash
        run: |
          git config user.name "newsflow-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/data/news.json public/data/data-status.json content/inbox content/state content/runs
          if git diff --staged --quiet; then
            echo "No review outcomes to commit."
            exit 0
          fi
          git commit -m "chore: apply review outcomes and refresh data status"
          git pull --rebase origin main
          git push
