name: Paid discovery smoke (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paid-discovery-smoke-temp.yml'

permissions:
  contents: read

concurrency:
  group: newsflow-paid-discovery-smoke
  cancel-in-progress: false

jobs:
  tavily-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run one bounded Tavily verification request
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_PURPOSE: verify
          TAVILY_QUERY: 'OpenAI Hugging Face model evaluation security incident August 2026'
          TAVILY_MAX_RESULTS: '3'
          TAVILY_RESERVE_CREDITS: '100'
          TAVILY_DAYS: '14'
        run: node scripts/pull-tavily-discovery.mjs > discovery-output.json

      - name: Publish result
        run: |
          echo '## Tavily paid verification smoke' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat discovery-output.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat discovery-output.json
