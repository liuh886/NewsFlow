name: Issue 130 display closeout

on:
  push:
    branches:
      - fix/latest-surface-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/latest-surface-events
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Unify Reader surface visibility ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/reader/edition.js')
          text = path.read_text()
          old = """const setEditionSurfaceHidden = (node, hidden) => {
            if (!node) return;
            node.hidden = hidden;
            if (hidden) node.style.setProperty('display', 'none', 'important');
            else node.style.removeProperty('display');
          };
          """
          new = """const setEditionSurfaceHidden = (node, hidden) => {
            if (!node) return;
            node.hidden = hidden;
            node.classList.toggle('is-latest-hidden', hidden);
          };
          """
          if old not in text:
              raise SystemExit('Edition visibility anchor missing')
          path.write_text(text.replace(old, new, 1))

          contract = Path('scripts/check-frontend-architecture.mjs')
          checks = contract.read_text()
          anchor = "if (!edition.includes(\"window.addEventListener('newsflow:latest-closed', applyEditionLayer)\")) throw new Error('Edition owner must restore itself after Latest closes.');"
          addition = anchor + "\nif (!edition.includes(\"classList.toggle('is-latest-hidden'\") || edition.includes(\"style.setProperty('display', 'none', 'important')\")) throw new Error('Edition visibility must use the shared semantic hidden contract.');"
          if anchor not in checks:
              raise SystemExit('Frontend contract anchor missing')
          contract.write_text(checks.replace(anchor, addition, 1))
          PY
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          python3 -m http.server 4173 --directory dist >/tmp/newsflow-preview.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          node tests/browser-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reader/edition.js scripts/check-frontend-architecture.mjs
          git commit -m "fix(reader): unify surface visibility ownership"
          git push origin HEAD:fix/latest-surface-events
