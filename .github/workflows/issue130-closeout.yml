name: Issue 130 closeout patch

on:
  push:
    branches:
      - fix/latest-surface-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/latest-surface-events
          fetch-depth: 0
      - name: Apply scoped Reader fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing: {path}')
              p.write_text(text.replace(old, new, 1))

          # Build: src/reader.css is the sole cascade owner; runtime is minified and budgeted.
          replace_once('scripts/build.mjs',
              "import { build } from 'esbuild';\n",
              "import { build } from 'esbuild';\nimport { gzipSync } from 'node:zlib';\n")
          replace_once('scripts/build.mjs', "  const bodyLines = svgTextLines(body, 28, 7);", "  const bodyLines = svgTextLines(body, 28, 5);")
          old_build = """const readerStylePaths = [
            'src/reader/base.css',
            'src/reader/interactions.css',
            'src/reader/edition.css',
            'src/reader/magazine.css',
            'src/reader/navigation.css',
            'src/reader/reading.css'
          ];
          const readerStyles = await Promise.all(readerStylePaths.map((path) => readFile(resolve(root, path), 'utf8')));
          await writeFile(resolve(dist, 'reader.css'), `${readerStyles.join('\\n\\n')}\\n`, 'utf8');
          await build({
            entryPoints: [resolve(root, 'src/reader-runtime.js')],
            bundle: true,
            format: 'esm',
            minify: false,
            sourcemap: false,
            target: ['es2022'],
            outfile: resolve(dist, 'reader-runtime.js')
          });
          """
          new_build = """await build({
            entryPoints: [resolve(root, 'src/reader.css')],
            bundle: true,
            minify: false,
            sourcemap: false,
            outfile: resolve(dist, 'reader.css')
          });
          await build({
            entryPoints: [resolve(root, 'src/reader-runtime.js')],
            bundle: true,
            format: 'esm',
            minify: true,
            sourcemap: false,
            target: ['es2022'],
            outfile: resolve(dist, 'reader-runtime.js')
          });
          const READER_RUNTIME_GZIP_BUDGET = 40 * 1024;
          const readerRuntimeGzipBytes = gzipSync(await readFile(resolve(dist, 'reader-runtime.js'))).byteLength;
          if (readerRuntimeGzipBytes > READER_RUNTIME_GZIP_BUDGET) {
            throw new Error(`reader-runtime.js gzip budget exceeded: ${readerRuntimeGzipBytes} > ${READER_RUNTIME_GZIP_BUDGET}`);
          }
          """
          replace_once('scripts/build.mjs', old_build, new_build)

          # Latest surface: semantic class ownership + independent close event.
          old_hidden = """  const setHidden = (node, hidden) => {
              if (!node) return;
              node.hidden = hidden;
              // Inline display toggling is enough: a non-important inline style already
              // outranks every non-important stylesheet rule, and keeps the cascade
              // overridable by the canonical visual owner.
              node.style.display = hidden ? 'none' : '';
            };
          """
          new_hidden = """  const setHidden = (node, hidden) => {
              if (!node) return;
              node.hidden = hidden;
              node.classList.toggle('is-latest-hidden', hidden);
            };
          """
          replace_once('public/latest-surface.js', old_hidden, new_hidden)
          replace_once('public/latest-surface.js',
              "    window.dispatchEvent(new CustomEvent('newsflow:rendered'));",
              "    window.dispatchEvent(new CustomEvent('newsflow:latest-closed'));")
          edition_css = Path('src/reader/edition.css')
          css = edition_css.read_text()
          if '.is-latest-hidden' not in css:
              if not css.endswith('\n'):
                  css += '\n'
              css += "\n.is-latest-hidden {\n  display: none;\n}\n"
              edition_css.write_text(css)
          replace_once('src/reader/edition.js',
              "window.addEventListener('newsflow:rendered', applyEditionLayer);\ninitializeEditionLayer();",
              "window.addEventListener('newsflow:rendered', applyEditionLayer);\nwindow.addEventListener('newsflow:latest-closed', applyEditionLayer);\ninitializeEditionLayer();")

          # Shared accessibility primitive already lives in Reader interactions.
          replace_once('src/reader/interactions.js',
              "const focusableSelector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\"-1\"])';\n",
              """const focusableSelector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\"-1\"])';
          const trapFocusWithin = (event, container) => {
            if (!container || event.key !== 'Tab') return;
            const focusable = [...container.querySelectorAll(focusableSelector)]
              .filter((element) => !element.hidden && element.getClientRects().length);
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable.at(-1);
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          };
          globalThis.NewsFlowA11y = Object.freeze({ trapFocusWithin });
          """)
          old_edition_trap = """const trapEditionFocus = (event) => {
            const panel = activeEditionPanel();
            if (!panel || event.key !== 'Tab') return;
            const focusable = [...panel.querySelectorAll(focusableSelector)].filter((element) => !element.hidden && element.getClientRects().length);
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable.at(-1);
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          };
          """
          replace_once('src/reader/interactions.js', old_edition_trap,
              """const trapEditionFocus = (event) => {
            trapFocusWithin(event, activeEditionPanel());
          };
          """)
          old_search_trap = """const trapSearchFocus = (event) => {
            if (!searchWasOpen || event.key !== 'Tab') return;
            const focusable = [...searchSheet.querySelectorAll(focusableSelector)].filter((element) => !element.hidden);
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable.at(-1);

            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          };
          """
          replace_once('src/reader/interactions.js', old_search_trap,
              """const trapSearchFocus = (event) => {
            if (!searchWasOpen) return;
            trapFocusWithin(event, searchSheet);
          };
          """)

          # Reading surface: each render owns/aborts its scroll listener; share dialog traps focus and inerts siblings.
          replace_once('public/reading-surface.js',
              "  };\n\n  const escapeHtml =",
              "  };\n  let renderController = null;\n\n  const escapeHtml =")
          replace_once('public/reading-surface.js',
              """  const setBackgroundInert = (inert) => {
              const app = document.querySelector('#app');
              if (!app) return;
              app.inert = inert;
              if (inert) app.setAttribute('aria-hidden', 'true');
              else app.removeAttribute('aria-hidden');
            };
          """,
              """  const setBackgroundInert = (inert) => {
              const app = document.querySelector('#app');
              if (!app) return;
              app.inert = inert;
              if (inert) app.setAttribute('aria-hidden', 'true');
              else app.removeAttribute('aria-hidden');
            };

            const syncShareDialogAccessibility = (shell) => {
              if (!shell || !state.shareOpen) return;
              [...shell.children].forEach((child) => {
                if (child.matches('.nf-share-backdrop, .nf-share-dialog')) return;
                child.inert = true;
                child.setAttribute('aria-hidden', 'true');
              });
            };
          """)
          replace_once('public/reading-surface.js',
              """  const render = () => {
              const root = ensureRoot();
              const item = activeItem();
          """,
              """  const render = () => {
              renderController?.abort();
              renderController = null;
              const root = ensureRoot();
              const item = activeItem();
          """)
          replace_once('public/reading-surface.js',
              """    const shell = root.querySelector('.nf-reading-shell');
              shell?.addEventListener('scroll', syncReadingProgress, { passive: true });
              syncReadingProgress();
          """,
              """    const shell = root.querySelector('.nf-reading-shell');
              renderController = new AbortController();
              shell?.addEventListener('scroll', syncReadingProgress, { passive: true, signal: renderController.signal });
              syncShareDialogAccessibility(shell);
              syncReadingProgress();
          """)
          replace_once('public/reading-surface.js',
              """  window.addEventListener('keydown', (event) => {
              if (!state.activeId) return;
              if (event.key === 'Escape') {
          """,
              """  window.addEventListener('keydown', (event) => {
              if (!state.activeId) return;
              if (state.shareOpen && event.key === 'Tab') {
                const dialog = document.querySelector(`#${ROOT_ID} .nf-share-dialog`);
                globalThis.NewsFlowA11y?.trapFocusWithin?.(event, dialog);
              }
              if (event.key === 'Escape') {
          """)

          # Contract now protects real build behavior and explicit lifecycle semantics.
          replace_once('scripts/check-frontend-architecture.mjs',
              "for (const contract of ['ensureMobileReaderSearch', 'syncEditionDialogAccessibility', 'syncEditionRouteFromLocation']) {",
              "for (const contract of ['ensureMobileReaderSearch', 'syncEditionDialogAccessibility', 'syncEditionRouteFromLocation', 'trapFocusWithin', 'NewsFlowA11y']) {")
          replace_once('scripts/check-frontend-architecture.mjs',
              """for (const contract of [
            'let latestOpen = false', \"dataset.latestAction = 'open'\", 'Latest adopted signals', \"window.addEventListener('newsflow:edition-rendered'\", \"data-edition-layer=\\\"latest\\\"\"
          ]) {
          """,
              """for (const contract of [
            'let latestOpen = false', \"dataset.latestAction = 'open'\", 'Latest adopted signals', \"window.addEventListener('newsflow:edition-rendered'\",
            \"new CustomEvent('newsflow:latest-closed')\", \"classList.toggle('is-latest-hidden'\", \"data-edition-layer=\\\"latest\\\"\"
          ]) {
          """)
          replace_once('scripts/check-frontend-architecture.mjs',
              "if (latest.includes('MutationObserver') || latest.includes('window.fetch =')) throw new Error('Latest Surface must remain a scoped presentation owner.');",
              """if (latest.includes('MutationObserver') || latest.includes('window.fetch =') || latest.includes("new CustomEvent('newsflow:rendered')")) throw new Error('Latest Surface must remain a scoped presentation owner.');
          if (!edition.includes("window.addEventListener('newsflow:latest-closed', applyEditionLayer)")) throw new Error('Edition owner must restore itself after Latest closes.');""")
          replace_once('scripts/check-frontend-architecture.mjs',
              """for (const contract of [
            \"const ROOT_ID = 'newsflow-reading-surface-root'\", '#read/', 'canonicalArticleUrl', \"window.addEventListener('newsflow:rendered'\", 'nf-reading-progress',
            \"data-reading-action=\\\"open-share\\\"\", 'NewsFlowShareCard', 'navigator.share', 'copy-link'
          ]) {
          """,
              """for (const contract of [
            \"const ROOT_ID = 'newsflow-reading-surface-root'\", '#read/', 'canonicalArticleUrl', \"window.addEventListener('newsflow:rendered'\", 'nf-reading-progress',
            \"data-reading-action=\\\"open-share\\\"\", 'NewsFlowShareCard', 'navigator.share', 'copy-link', 'renderController', 'AbortController',
            'syncShareDialogAccessibility', 'NewsFlowA11y?.trapFocusWithin'
          ]) {
          """)
          replace_once('scripts/check-frontend-architecture.mjs',
              """for (const contract of ['generatePublicationPages', \"resolve(dist, 'feed.xml')\", \"resolve(dist, 'rss.xml')\", \"resolve(dist, 'sitemap.xml')\", \"resolve(dist, 'reader.css')\", \"resolve(dist, 'reader-runtime.js')\"]) {
            if (!build.includes(contract)) throw new Error(`Build missing static publication/Reader contract ${contract}`);
          }
          """,
              """for (const contract of ['generatePublicationPages', \"resolve(dist, 'feed.xml')\", \"resolve(dist, 'rss.xml')\", \"resolve(dist, 'sitemap.xml')\", \"entryPoints: [resolve(root, 'src/reader.css')]\", \"resolve(dist, 'reader-runtime.js')\", 'READER_RUNTIME_GZIP_BUDGET', 'svgTextLines(body, 28, 5)']) {
            if (!build.includes(contract)) throw new Error(`Build missing static publication/Reader contract ${contract}`);
          }
          if (build.includes('readerStylePaths')) throw new Error('Build must consume src/reader.css instead of owning a second cascade list.');
          if (!build.includes('minify: true')) throw new Error('Production Reader runtime must be minified.');
          """)

          # The existing magazine contract remains useful because src/reader.css is now the actual build entry.
          PY
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.mjs public/latest-surface.js public/reading-surface.js src/reader/interactions.js src/reader/edition.js src/reader/edition.css scripts/check-frontend-architecture.mjs
          git commit -m "fix(reader): close frontend lifecycle and build gaps"
          git push origin HEAD:fix/latest-surface-events
